name: Release
# Tag atıldığında (v0.1.0 gibi) üç platform için taşınabilir paket üretir ve GitHub Release'e ekler.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: zip }
          - { os: ubuntu-24.04,   name: linux-x64,   ext: tar.gz }
          - { os: macos-latest,   name: macos-arm64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libpulse-dev \
            libvulkan-dev glslc glslang-tools spirv-headers ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1   # tam SDK: glslc de içinde (cmake Vulkan::glslc için gerekli)
        with: { vulkan_version: 1.4.309.0, install_runtime: true, cache: true }
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Hide Git's link.exe (Windows)   # Git Bash'in /usr/bin/link'i MSVC link.exe'nin önüne geçiyor
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - name: SPIRV-Headers (Windows)   # ggml-vulkan find_package(SPIRV-Headers) ister; SDK cmake yapılandırması içermiyor
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/spirv-src"
          cmake -S "$RUNNER_TEMP/spirv-src" -B "$RUNNER_TEMP/spirv-build" -G Ninja -DCMAKE_INSTALL_PREFIX="C:/spirv-headers"
          cmake --install "$RUNNER_TEMP/spirv-build"
          echo "CMAKE_PREFIX_PATH=C:/spirv-headers" >> "$GITHUB_ENV"

      - name: Build app
        working-directory: app
        shell: bash
        run: bash ../scripts/ci-run.sh cargo build --release
      - name: Build whisper.cpp + llama.cpp servers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-run.sh pwsh -File scripts/build-sidecars.ps1
      - name: Build whisper.cpp + llama.cpp servers (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/ci-run.sh bash scripts/build-sidecars.sh

      - name: Assemble package
        shell: bash
        run: |
          set -e
          V="${GITHUB_REF_NAME:-dev}"
          P="echosub-$V-${{ matrix.name }}"
          mkdir -p "dist/$P/runtime" "dist/$P/scripts"
          if [ "$RUNNER_OS" = "Windows" ]; then cp app/target/release/echosub.exe "dist/$P/"; else cp app/target/release/echosub "dist/$P/"; fi
          cp -r app/runtime/whisper app/runtime/llama "dist/$P/runtime/"
          cp scripts/download-models.* "dist/$P/scripts/"
          cp README.md README.tr.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "dist/$P/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then 7z a "$P.zip" "$P" >/dev/null; else tar czf "$P.tar.gz" "$P"; fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/echosub-*.*
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "## EchoSub $V"
            echo
            awk -v v="[$V]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md
            echo
            echo "### Install"
            echo "Download the archive for your system, unzip it and run \`echosub\`. On first start EchoSub asks before downloading the AI models (about 3.1 GB, once). Details in the README."
            echo
            echo "> Windows is tested on real hardware. Linux and macOS packages are built by CI but not yet validated on real hardware."
          } > release-notes.md
          cat release-notes.md
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/echosub-*.*
          body_path: release-notes.md
          prerelease: true   # Linux/macOS paketleri henüz gerçek donanımda doğrulanmadı
