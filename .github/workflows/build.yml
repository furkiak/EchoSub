name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libpulse-dev
      - name: Test
        shell: bash
        run: bash ../scripts/ci-run.sh cargo test --release
      - name: Build
        shell: bash
        run: bash ../scripts/ci-run.sh cargo build --release
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: JavaScript syntax check
        run: for f in app/ui/*.js tools/screenshots/*.js; do node --check "$f"; done
      - name: Shell script syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done
